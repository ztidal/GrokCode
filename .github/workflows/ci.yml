name: CI

on:
  push:
    # `hardening` is this repository's default branch; `main` is upstream's
    # line and carries none of our changes.
    branches: [hardening]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Frontend only here — full `npm run check` also runs Rust (needs toolchain).
      - run: npm run check:frontend

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # PR caches are scoped to that PR and cannot help hardening or another PR.
          # Restore hardening's cache everywhere, but only pay the upload cost on hardening.
          save-if: ${{ github.ref == 'refs/heads/hardening' }}
      # Keep the same commands as scripts/check-rust.mjs without installing the
      # unrelated frontend dependency tree in this job.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
