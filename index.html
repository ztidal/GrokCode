<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrokCode</title>
    <!--
      Cold-start paint before CSS loads. Keep in sync with tokens.css Dawn:
      glass base rgba(250,244,237,.48), subtle #797593,
      highlightHigh #cecacd, rose #d7827e
      …and theme-dark.css Moon: base #232136, subtle #908caa,
      highlightHigh #56526e, rose #ea9a97. Dark's splash is opaque because the
      native material behind it is tinted cream on Windows and cannot follow.
      …and theme-puredark.css: base #000000, subtle #9d9daa,
      highlightHigh #38383d, rose #ea9a97. Spelled once, not twice — no
      prefers-color-scheme value asks for pure black, so it can only ever
      arrive as a stamped attribute, one frame after main.tsx runs.

      The dark half is spelled twice for the same reason theme-dark.css spells
      it twice: the media query is the only half that can be right on the very
      first frame, since main.tsx cannot stamp data-theme until it runs.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: #797593;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #root {
        height: 100%;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(250, 244, 237, 0.48);
        z-index: 9999;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #boot-splash.done {
        opacity: 0;
      }
      #boot-splash .mark {
        width: 28px;
        height: 28px;
        border: 2px solid #cecacd;
        border-top-color: #d7827e;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot-splash .label {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      :root[data-theme="dark"] body {
        color: #908caa;
      }
      :root[data-theme="dark"] #boot-splash {
        background: #232136;
      }
      :root[data-theme="dark"] #boot-splash .mark {
        border-color: #56526e;
        border-top-color: #ea9a97;
      }

      :root[data-theme="puredark"] body {
        color: #9d9daa;
      }
      :root[data-theme="puredark"] #boot-splash {
        background: #000000;
      }
      :root[data-theme="puredark"] #boot-splash .mark {
        border-color: #38383d;
        border-top-color: #ea9a97;
      }
      /* Warm Gold shares Pure Dark's black ground; only the spinner says so. */
      :root[data-theme="warmgold"] body {
        color: #9d9daa;
      }
      :root[data-theme="warmgold"] #boot-splash {
        background: #000000;
      }
      :root[data-theme="warmgold"] #boot-splash .mark {
        border-color: #38383d;
        border-top-color: #f6c177;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-theme="puredark"]):not([data-theme="warmgold"]) body {
          color: #908caa;
        }
        :root:not([data-theme="light"]):not([data-theme="puredark"]):not([data-theme="warmgold"])
          #boot-splash {
          background: #232136;
        }
        :root:not([data-theme="light"]):not([data-theme="puredark"]):not([data-theme="warmgold"])
          #boot-splash
          .mark {
          border-color: #56526e;
          border-top-color: #ea9a97;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark"></div>
      <div class="label">GrokCode</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
